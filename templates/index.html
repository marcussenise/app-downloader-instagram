<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Instagram Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }

    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      border-radius: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg { width: 30px; height: 30px; fill: white; }

    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 32px;
      color: #fff;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #1a1a1a;
      border-radius: 18px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    textarea {
      width: 100%;
      padding: 14px;
      background: #252525;
      border: 1.5px solid #333;
      border-radius: 12px;
      color: #f0f0f0;
      font-size: 0.95rem;
      resize: none;
      height: 80px;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus { border-color: #cc2366; }
    textarea::placeholder { color: #666; }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(90deg, #e6683c, #cc2366, #bc1888);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    button:active { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: default; }

    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.5;
      display: none;
      word-break: break-all;
      overflow-wrap: break-word;
    }

    .msg.ok {
      background: #0d2b1a;
      border: 1px solid #1a5c35;
      color: #4cde89;
    }

    .msg.err {
      background: #2b0d0d;
      border: 1px solid #5c1a1a;
      color: #de4c4c;
    }

    .hint {
      text-align: center;
      font-size: 0.78rem;
      color: #444;
      margin-top: 8px;
    }

    .meta-block {
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .meta-row {
      background: #252525;
      border: 1.5px solid #333;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-label {
      font-size: 0.72rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .meta-value {
      font-size: 0.92rem;
      color: #f0f0f0;
      word-break: break-word;
      white-space: pre-wrap;
      max-height: 280px;
      overflow-y: auto;
    }

    .copy-btn {
      align-self: flex-end;
      margin-top: 4px;
      padding: 6px 14px;
      background: #333;
      border: none;
      border-radius: 8px;
      color: #ccc;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      transition: background 0.2s, color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn:active { opacity: 0.85; }
    .copy-btn.copied { background: #1a5c35; color: #4cde89; }

    .etapa-pt {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
    }

    textarea.editor { height: 260px; resize: vertical; }
    textarea.editor-curto { height: 56px; }

    .cta-lista {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .cta-opcao {
      display: block;
      text-align: left;
      width: 100%;
      padding: 10px 12px;
      background: #1c1c1c;
      border: 1.5px solid #333;
      border-radius: 10px;
      color: #ddd;
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.35;
      cursor: pointer;
      white-space: pre-wrap;
      word-break: break-word;
      transition: border-color 0.2s, background 0.2s;
    }

    .cta-opcao.selecionado {
      border-color: #4cde89;
      background: #1a2e22;
      color: #f0f0f0;
    }
  </style>
</head>
<body>

  <div class="logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.334 3.608 1.31.975.975 1.247 2.242 1.31 3.608.058 1.265.07 1.645.07 4.849s-.012 3.584-.07 4.85c-.063 1.366-.335 2.633-1.31 3.608-.975.975-2.242 1.247-3.608 1.31-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-1.366-.063-2.633-.335-3.608-1.31-.975-.975-1.247-2.242-1.31-3.608C2.175 15.584 2.163 15.204 2.163 12s.012-3.584.07-4.85c.063-1.366.335-2.633 1.31-3.608.975-.975 2.242-1.247 3.608-1.31C8.416 2.175 8.796 2.163 12 2.163M12 0C8.741 0 8.333.014 7.053.072 5.197.157 3.355.673 2.014 2.014.673 3.355.157 5.197.072 7.053.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.085 1.856.601 3.698 1.942 5.038 1.341 1.341 3.183 1.857 5.038 1.942C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 1.856-.085 3.698-.601 5.038-1.942 1.341-1.34 1.857-3.182 1.942-5.038.058-1.28.072-1.689.072-4.948 0-3.259-.014-3.667-.072-4.947-.085-1.856-.601-3.698-1.942-5.038C20.646.673 18.804.157 16.948.072 15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324A6.162 6.162 0 0 0 12 5.838zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/>
    </svg>
  </div>

  <h1>Instagram Downloader</h1>

  <div class="card">
   <textarea id="url" placeholder="Cole o link do post, reel ou carrossel..."></textarea>
    <button type="button" id="btn-colar">Colar Link</button>

    <button id="btn" onclick="baixar()">
      <div class="spinner" id="spinner"></div>
      <span id="btn-text">Baixar</span>
    </button>

    <div class="msg ok" id="msg-ok"></div>
    <div class="msg err" id="msg-err"></div>

    <div class="meta-row">
      <span class="meta-label">Pesquisa — tema do post (opcional se a descrição já disser)</span>
      <textarea id="tema" placeholder="Ex: tartarugas na praia Ostional, Costa Rica"></textarea>
      <button type="button" onclick="pesquisarNoClaude()">1. Copiar pedido e abrir o Claude</button>
      <button type="button" onclick="colarPortugues()">2. Colar texto em português</button>

      <div class="etapa-pt" id="etapa-pt">
        <span class="meta-label">Texto em português — revise e edite à vontade</span>
        <textarea id="texto-pt" class="editor"></textarea>
        <span class="meta-label" id="contador-pt"></span>
        <span class="meta-label">Hashtags (máx. 5)</span>
        <textarea id="hashtags" class="editor-curto"></textarea>
        <button type="button" onclick="pedirTraducao()">3. Aprovar e copiar pedido de tradução</button>
        <button type="button" onclick="colarIngles()">4. Colar tradução em inglês</button>
      </div>

      <div class="msg ok" id="msg-legenda-ok"></div>
      <div class="msg err" id="msg-legenda-err"></div>
    </div>

    <div class="meta-block" id="meta-block">
      <div class="meta-row" id="row-uploader">
        <span class="meta-label">Conta</span>
        <span class="meta-value" id="meta-uploader"></span>
        <button class="copy-btn" onclick="copiar('meta-uploader', this)">Copiar</button>
      </div>
      <div class="meta-row" id="row-desc">
        <span class="meta-label">Legenda final</span>
        <span class="meta-value" id="meta-desc"></span>
        <span class="meta-label" id="meta-contador"></span>
        <button class="copy-btn" onclick="copiar('meta-desc', this)">Copiar</button>
      </div>
      <div class="meta-row" id="row-frase">
        <span class="meta-label">CTA — toque para incluir na descrição</span>
        <div class="cta-lista" id="cta-lista"></div>
      </div>
    </div>
  </div>

  <p class="hint">Os arquivos são salvos em Downloads/Instagram</p>

  <script>
    const frasesCTA = [
      '🧭 Para mais dicas e curiosidades sobre arte, viagem e cultura: @explorai.com.br',
      '🧭 Planeje, descubra, explore! Sua viagem fica completa no @explorai.com.br - Com um app em breve saindo do forno! Fique ligado nas novidades 🛫',
      '📲 Em breve, um aplicativo para ajudar você viajante, em todo momento da sua próxima viagem! 🛫 Siga  @explorai.com.br  e acompanhe!'
    ];
    const textarea = document.getElementById('url');
    const botaoColar = document.getElementById('btn-colar');

    botaoColar.addEventListener('click', async () => {
    try {
      // Solicita a permissão e lê o texto da área de transferência
      const textoCopiado = await navigator.clipboard.readText();
      
      // Insere o texto dentro do textarea
      textarea.value = textoCopiado;
    } catch (erro) {
      // Caso o usuário negue a permissão ou o navegador não suporte
      alert('Não foi possível colar automaticamente. Por favor, use Ctrl+V ou clique com o botão direito.');
      console.error('Erro ao ler a área de transferência: ', erro);
    }
  });

    function copiar(elementId, btn) {
      const text = document.getElementById(elementId).textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "Copiado!";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "Copiar"; btn.classList.remove("copied"); }, 2000);
      });
    }

    // Estado do post atual, usado para remontar a legenda final
    // pt/en: textos gerados pelo Claude; quando existem, substituem a descrição original
    const metaAtual = { uploader: "", description: "", pt: "", en: "", hashtags: [], cta: -1 };

    const LIMITE_INSTAGRAM = 2200;
    const MAX_HASHTAGS = 5;
    const SEPARADOR = "\n\n";
    // Na mesma linha do gancho, para não gastar uma das 3 linhas visíveis antes do "...mais"
    const BANDEIRA_PT = "🇧🇷 ";
    const BANDEIRA_EN = "🇺🇸 ";
    const RESERVA_HASHTAGS = 120;

    function textoCredito(uploader) {
      return uploader ? `🎥: ${uploader}` : "";
    }

    // Caracteres que sobram para PT + EN + hashtags, reservando o maior CTA,
    // o crédito e as quebras de linha entre as partes
    function orcamentoTexto() {
      const maiorCTA = Math.max(...frasesCTA.map(f => f.length));
      const credito = textoCredito(metaAtual.uploader) || textoCredito("@" + "x".repeat(30));
      return LIMITE_INSTAGRAM - maiorCTA - credito.length - SEPARADOR.length * 3;
    }

    // Bandeiras e a quebra de linha entre PT e EN
    const EXTRAS_IDIOMAS = BANDEIRA_PT.length + BANDEIRA_EN.length + SEPARADOR.length;

    // Metade do espaço para cada idioma, já descontando a reserva das hashtags
    function limitePortugues() {
      return Math.floor((orcamentoTexto() - EXTRAS_IDIOMAS - RESERVA_HASHTAGS) / 2);
    }

    // A tradução fica com tudo que sobrou depois do português e das hashtags reais
    function limiteIngles() {
      return orcamentoTexto() - EXTRAS_IDIOMAS - metaAtual.pt.length - metaAtual.hashtags.join(" ").length;
    }

    function extrairHashtags(texto) {
      return (texto.match(/#[\p{L}\p{N}_]+/gu) || []).slice(0, MAX_HASHTAGS);
    }

    // Separa as linhas finais só com hashtags do resto do texto
    function separarHashtags(texto) {
      const linhas = texto.trim().split("\n");
      const tags = [];
      while (linhas.length && /^\s*(#[\p{L}\p{N}_]+\s*)+$/u.test(linhas[linhas.length - 1])) {
        tags.unshift(...linhas.pop().match(/#[\p{L}\p{N}_]+/gu));
      }
      return { corpo: linhas.join("\n").trim(), hashtags: tags.slice(0, MAX_HASHTAGS) };
    }

    function renderizarCTAs() {
      const lista = document.getElementById("cta-lista");
      lista.innerHTML = "";
      frasesCTA.forEach((frase, i) => {
        const opcao = document.createElement("button");
        opcao.type = "button";
        opcao.className = "cta-opcao" + (i === metaAtual.cta ? " selecionado" : "");
        opcao.textContent = frase;
        opcao.addEventListener("click", () => {
          // Tocar no CTA já selecionado remove ele da descrição
          metaAtual.cta = metaAtual.cta === i ? -1 : i;
          renderizarCTAs();
          atualizarDescricao();
        });
        lista.appendChild(opcao);
      });
    }

    // .length conta emojis como 2, então os contadores erram para o lado seguro
    function mostrarContador(id, usado, limite, dica) {
      const el = document.getElementById(id);
      const passou = usado > limite;
      el.textContent = `${usado} / ${limite} caracteres` + (passou ? ` — ${dica}` : "");
      el.style.color = passou ? "#de4c4c" : "";
    }

    function atualizarDescricao() {
      const { uploader, description, pt, en, hashtags, cta } = metaAtual;
      const textos = [pt && BANDEIRA_PT + pt, en && BANDEIRA_EN + en].filter(Boolean).join(SEPARADOR);
      const partes = [textos || description, frasesCTA[cta], textoCredito(uploader), hashtags.join(" ")];
      const descCompleta = partes.filter(Boolean).join(SEPARADOR);
      document.getElementById("meta-desc").textContent = descCompleta;
      document.getElementById("row-desc").style.display = descCompleta ? "flex" : "none";

      mostrarContador("meta-contador", descCompleta.length, LIMITE_INSTAGRAM, "passou do limite, encurte o texto");
      if (pt) {
        mostrarContador("contador-pt", pt.length, limitePortugues(), "encurte para a tradução caber");
      }
    }

    function mostrarMeta(uploader, description) {
      metaAtual.uploader = uploader || "";
      metaAtual.description = description || "";
      metaAtual.pt = "";
      metaAtual.en = "";
      metaAtual.hashtags = [];
      metaAtual.cta = -1;
      document.getElementById("texto-pt").value = "";
      document.getElementById("hashtags").value = "";
      document.getElementById("etapa-pt").style.display = "none";
      mostrarAvisoLegenda("", "");

      document.getElementById("meta-uploader").textContent = metaAtual.uploader;
      document.getElementById("row-uploader").style.display = uploader ? "flex" : "none";
      document.getElementById("row-frase").style.display = "flex";
      renderizarCTAs();
      atualizarDescricao();
      document.getElementById("meta-block").style.display = (uploader || description) ? "flex" : "none";
    }

    // Pedidos enviados ao Claude (claude.ai / app), usando a assinatura em vez da API.
    // Os alvos ficam ~10% abaixo do limite real porque o Claude não conta caracteres com precisão.
    function pedidoPortugues() {
      const alvo = Math.floor(limitePortugues() * 0.9);
      return `Escreva uma legenda de Instagram para o perfil @explorai.com.br (arte, viagem e cultura).

Pesquise na web e escreva em português do Brasil.

ABERTURA (o mais importante): o Instagram só mostra ~125 caracteres antes do "...mais". Se as 3 primeiras linhas não prenderem, ninguém lê o resto. Comece com 3 linhas curtas, separadas por uma única quebra de linha, somando no máximo 110 caracteres:
- Linha 1: afirmação forte ou número específico e surpreendente sobre o lugar (um fato real da pesquisa).
- Linha 2: tensão ou promessa — o que a pessoa vai descobrir.
- Linha 3: convite implícito para continuar lendo, terminando com 👇.
Nada de saudação nem introdução genérica ("Oi gente", "Hoje vou falar sobre", "Você sabia...?"). Não comece a primeira linha com emoji.
Exemplo do formato (outro tema): "Uma praia recebe 500 mil tartarugas em 3 noites.\nE ninguém sabe exatamente por quê.\nOlha o que acontece por lá 👇"

DEPOIS DA ABERTURA, uma linha em branco e:
- 3 a 5 parágrafos curtos (1 a 3 frases cada), dinâmicos mas informativos, que cumpram a promessa da abertura.
- Diga onde fica o lugar (cidade, região, país) e traga história, curiosidades e o que torna aquilo especial; se fizer sentido, a melhor época para visitar.
- Use só fatos que você confirmou na pesquisa; prefira números e nomes concretos a adjetivos genéricos.
- Um emoji no início de alguns parágrafos, sem exagero. Sem links e sem bandeiras.
- Na última linha, no máximo ${MAX_HASHTAGS} hashtags relacionadas e muito usadas, separadas por espaço.
- Não inclua chamada para seguir o perfil nem crédito do autor do vídeo.
- Escreva só em português; a tradução para o inglês será pedida depois.

LIMITE DE TAMANHO: o texto (sem contar as hashtags) deve ter no máximo ${alvo} caracteres, contando espaços, quebras de linha e emojis. Se precisar, use menos parágrafos. Conte antes de responder.

Responda só com a legenda, sem introdução nem comentários.`;
    }

    function pedidoIngles() {
      const alvo = Math.floor(limiteIngles() * 0.9);
      return `Traduza para o inglês dos EUA a legenda de Instagram abaixo.
- Mantenha os parágrafos, os emojis e o tom.
- As 3 primeiras linhas são o gancho que aparece antes do "...mais": mantenha-as curtas, fortes e em 3 linhas separadas, somando no máximo 110 caracteres.
- Não adicione nem remova informações, hashtags ou bandeiras.
- No máximo ${alvo} caracteres, contando espaços, quebras de linha e emojis.

Responda só com a tradução, sem introdução nem comentários.

${metaAtual.pt}`;
    }

    function mostrarAvisoLegenda(ok, erro) {
      const msgOk = document.getElementById("msg-legenda-ok");
      const msgErr = document.getElementById("msg-legenda-err");
      msgOk.textContent = ok;
      msgOk.style.display = ok ? "block" : "none";
      msgErr.textContent = erro;
      msgErr.style.display = erro ? "block" : "none";
    }

    async function lerAreaDeTransferencia() {
      try {
        const texto = (await navigator.clipboard.readText()).trim();
        if (!texto) mostrarAvisoLegenda("", "Copie a resposta do Claude primeiro.");
        return texto;
      } catch (e) {
        mostrarAvisoLegenda("", "Não foi possível ler a área de transferência. Permita o acesso e tente de novo.");
        return "";
      }
    }

    function mostrarResultado() {
      document.getElementById("row-frase").style.display = "flex";
      renderizarCTAs();
      atualizarDescricao();
      document.getElementById("meta-block").style.display = "flex";
    }

    function pesquisarNoClaude() {
      const tema = document.getElementById("tema").value.trim();
      mostrarAvisoLegenda("", "");
      if (!tema && !metaAtual.description) {
        mostrarAvisoLegenda("", "Escreva um tema ou baixe um post com descrição primeiro.");
        return;
      }

      const partes = [pedidoPortugues()];
      if (tema) partes.push(`Tema: ${tema}`);
      if (metaAtual.description) partes.push(`Descrição original do vídeo:\n${metaAtual.description}`);

      // Copia e abre na mesma interação do toque, senão o navegador bloqueia
      navigator.clipboard.writeText(partes.join("\n\n"))
        .catch(() => mostrarAvisoLegenda("", "Não foi possível copiar o pedido automaticamente."));
      window.open("https://claude.ai/new", "_blank");
    }

    async function colarPortugues() {
      mostrarAvisoLegenda("", "");
      const texto = await lerAreaDeTransferencia();
      if (!texto) return;

      const { corpo, hashtags } = separarHashtags(texto);
      metaAtual.pt = corpo;
      metaAtual.en = "";
      metaAtual.hashtags = hashtags;
      document.getElementById("texto-pt").value = corpo;
      document.getElementById("hashtags").value = hashtags.join(" ");
      document.getElementById("etapa-pt").style.display = "flex";
      mostrarResultado();
    }

    function pedirTraducao() {
      if (!metaAtual.pt) {
        mostrarAvisoLegenda("", "Cole ou escreva o texto em português primeiro.");
        return;
      }
      navigator.clipboard.writeText(pedidoIngles())
        .then(() => mostrarAvisoLegenda("Pedido de tradução copiado. Cole na mesma conversa do Claude e depois toque em 4.", ""))
        .catch(() => mostrarAvisoLegenda("", "Não foi possível copiar o pedido automaticamente."));
    }

    async function colarIngles() {
      if (!metaAtual.pt) {
        mostrarAvisoLegenda("", "Cole ou escreva o texto em português primeiro.");
        return;
      }
      mostrarAvisoLegenda("", "");
      const texto = await lerAreaDeTransferencia();
      if (!texto) return;
      // Se o Claude devolver hashtags junto, ficam só as que já estão no campo
      metaAtual.en = separarHashtags(texto).corpo;
      mostrarResultado();
    }

    // Edição do português invalida a tradução: ela precisa ser pedida de novo
    document.getElementById("texto-pt").addEventListener("input", e => {
      metaAtual.pt = e.target.value.trim();
      if (metaAtual.en) {
        metaAtual.en = "";
        mostrarAvisoLegenda("", "Texto em português mudou — peça a tradução de novo (passo 3).");
      }
      atualizarDescricao();
    });

    document.getElementById("hashtags").addEventListener("input", e => {
      metaAtual.hashtags = extrairHashtags(e.target.value);
      atualizarDescricao();
    });

    async function baixar() {
      const url = document.getElementById("url").value.trim();
      const btn = document.getElementById("btn");
      const spinner = document.getElementById("spinner");
      const btnText = document.getElementById("btn-text");
      const msgOk = document.getElementById("msg-ok");
      const msgErr = document.getElementById("msg-err");

      msgOk.style.display = "none";
      msgErr.style.display = "none";
      document.getElementById("meta-block").style.display = "none";

      if (!url) {
        msgErr.textContent = "Cole um link do Instagram primeiro.";
        msgErr.style.display = "block";
        return;
      }

      btn.disabled = true;
      spinner.style.display = "block";
      btnText.textContent = "Baixando...";

      try {
        const res = await fetch("/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();

        if (data.ok) {
          const lista = data.arquivos ? data.arquivos.map(f => `• ${f}`).join("<br>") : "";
          msgOk.innerHTML = `✓ ${data.tipo} salvo em:<br><b>${data.pasta}</b>${lista ? "<br><small>" + lista + "</small>" : ""}`;
          msgOk.style.display = "block";
          mostrarMeta(data.uploader || "", data.description || "");
          document.getElementById("url").value = "";
        } else {
          msgErr.innerHTML = (data.error || "Erro desconhecido.") + `<br><small>Veja <b>debug.log</b> para detalhes.</small>`;
          msgErr.style.display = "block";
        }
      } catch (e) {
        msgErr.textContent = "Não foi possível conectar. O app está rodando?";
        msgErr.style.display = "block";
      } finally {
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "Baixar";
      }
    }

    // Permite colar e enviar com Enter no textarea
    document.getElementById("url").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); baixar(); }
    });
  </script>

</body>
</html>
